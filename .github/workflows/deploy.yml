# Builds the Astro site and deploys it to GitHub Pages on every push to main.
# Served at the custom domain in public/CNAME (www.ontargetcarpetcleaning.co.uk).
#
# One-time setup in the repo:
#   1. Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   2. Settings → Pages → Custom domain: www.ontargetcarpetcleaning.co.uk
#      (only works once the DNS records below are in place — see README).
#   3. Optional — Settings → Secrets and variables → Actions, add:
#      PUBLIC_GA_ID (GA4 measurement ID) and/or GOOGLE_PLACES_API_KEY
#      (live Google reviews). Both are optional; the site builds without them.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          PUBLIC_GA_ID: ${{ secrets.PUBLIC_GA_ID }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
