# Serves the static Astro build. Astro uses directory-format output
# (e.g. /about/index.html), so clean URLs are handled with try_files below.
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Compression ──
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml
                      application/javascript application/json application/xml
                      image/svg+xml font/woff2;

    # ── Security headers ──
    # These are inherited by any location that doesn't set its own add_header
    # (nginx replaces, not merges, add_header at the deepest level). The two
    # asset locations below use `expires` only, so HTML and media keep these.
    add_header X-Content-Type-Options "nosniff"                    always;
    add_header X-Frame-Options        "SAMEORIGIN"                 always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Astro emits this on every build.
    error_page 404 /404.html;

    # Content-hashed build assets are immutable — cache hard. `^~` stops the
    # regex media block below from stealing woff2/svg files out of here.
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images & fonts — cache a month (uses `expires` only, so it still inherits
    # the security headers above).
    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }

    # Everything else (HTML pages, sitemap, robots.txt). Clean URLs: try the
    # exact file, then <path>.html, then a directory index. `expires -1` makes
    # HTML always revalidate so edits go live on the next deploy.
    location / {
        try_files $uri $uri.html $uri/ =404;
        expires -1;
    }
}
